<!DOCTYPE html>
<html lang="ku" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازار و CV</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2430;--mu:#6b7686;--pr:#1f7a6d;--bd:#e2e7ef}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222c;--tx:#eef2f7;--mu:#9aa6b6;--bd:#2a3542;--pr:#3bb5a3;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 80px}
.w{max-width:560px;margin:auto;padding:14px}h2{margin:6px 0 12px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:11px}nav button.on{color:var(--pr);font-weight:bold}nav span{display:block;font-size:20px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--mu);margin-left:4px}
.pr{color:var(--pr);font-weight:bold}.img{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;flex:none}.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{flex:none;padding:6px 14px;border-radius:20px}
.cv{background:#fff;color:#222;border-radius:10px;overflow:hidden;font-size:13px;line-height:1.7;border:1px solid var(--bd)}
.cv h1{margin:0;font-size:22px}.cv h4{margin:10px 0 3px;color:var(--c);border-bottom:2px solid var(--c)}.cv .p{padding:14px}.cv .hd{background:var(--c);color:#fff;padding:16px}
.t2{display:flex}.t2 .sd{background:var(--c);color:#fff;width:35%;padding:14px}.t2 .mn{flex:1;padding:14px}
.t3 .hd{background:none;color:#222;text-align:center;border-bottom:4px solid var(--c)}.t4 .p{background:linear-gradient(var(--c)22,#fff)}.t4 h4{background:var(--c);color:#fff;padding:3px 10px;border-radius:20px;border:0}
pre{white-space:pre-wrap;margin:0;font:inherit}.login{text-align:center;margin-top:8vh}
</style></head><body>
<div class="w" id="app"></div><nav id="nav"></nav><div id="rc"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut,RecaptchaVerifier,signInWithPhoneNumber,signInWithEmailAndPassword,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,updateDoc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyD4bdVNQHdPdUSArJWGzR07Bp1TsuoLm9o",authDomain:"bazar-cv.firebaseapp.com",projectId:"bazar-cv",storageBucket:"bazar-cv.firebasestorage.app",messagingSenderId:"814526110950",appId:"1:814526110950:web:18b9169f67890477366f27"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ADMIN="+9647504211356",PAY="07504211356",WA="9647513578668",MAIL="zeravan180@gmail.com";
const COLORS=["#1f7a6d","#2563eb","#c026d3","#e11d48","#ea580c","#334155"],TPL=["کلاسیک","مۆدێرن","سادە","جوان"];
const CATS={shop:{n:"دوکان",i:"🛍️",x:"جۆرێ بەرهەمی",k:["نوو","بکارهاتی"]},land:{n:"ئەرد و خانی",i:"🏠",x:"ڕووبەر (م²)",k:["فرۆتن","کڕین","کرێ"]},car:{n:"ترومبێل",i:"🚗",x:"مۆدێل و ساڵ",k:["فرۆتن","کڕین"]},job:{n:"کار",i:"💼",x:"مووچە",k:["خودان کار (کرێکار دڤێت)","کرێکار (کار دڤێت)"]}};
let U=null,A=[],CV={name:"",title:"",phone:"",email:"",city:"",sum:"",skills:"",exp:"",edu:"",tpl:0,col:0},S={view:"cv",cat:"",K:"",Q:"",CT:"",PM:"FIB",mode:"phone",sent:0,PF:null},conf=null,img="",tm;
const isAdmin=()=>U&&U.phoneNumber===ADMIN;
onAuthStateChanged(auth,async u=>{U=u;if(u){try{const d=await getDoc(doc(db,"cvs",u.uid));if(d.exists())CV={...CV,...d.data()};else CV.phone=u.phoneNumber||""}catch(e){}}draw()});
onSnapshot(collection(db,"ads"),s=>{A=s.docs.map(d=>({id:d.id,...d.data()}));if(U&&S.view!="cv"&&S.view!="set"&&S.cat!="add")draw()});
function draw(){const a=$("#app"),n=$("#nav");
if(!U){n.style.display="none";const ph=S.mode=="phone";a.innerHTML=`<div class="login"><div style="font-size:60px">📱</div><h2>بخێر بێی</h2>
<div class="chips" style="justify-content:center"><button class="${ph?"":"g"}" onclick="S.mode='phone';draw()">ژمارا مۆبایلێ</button><button class="${ph?"g":""}" onclick="S.mode='email';draw()">ئیمەیل</button></div>
${ph?`<input id="ph" type="tel" dir="ltr" placeholder="07xx xxx xxxx">${S.sent?`<input id="cd" dir="ltr" placeholder="کۆدا SMS" maxlength="6"><button class="full" onclick="verify()">چوونەژوور</button>`:`<button class="full" onclick="sendCode()">کۆدی بنێرە</button>`}`:`<input id="em" type="email" dir="ltr" placeholder="Email"><input id="pw" type="password" dir="ltr" placeholder="Password (6+)"><div class="row"><button onclick="emailAuth(0)">چوونەژوور</button><button class="g" onclick="emailAuth(1)">هەژمارەکا نوی</button></div>`}</div>`;return}
n.style.display="flex";n.innerHTML=[["cv","📄","CV"],["shop","🛍️","دوکان"],["land","🏠","ئەرد"],["car","🚗","ترومبێل"],["job","💼","کار"],["set","⚙️","ڕێکخستن"]].map(x=>`<button class="${S.view==x[0]?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("");
a.innerHTML=S.view=="cv"?cvView():S.view=="set"?setView():catView(S.view)}
const W=o=>Object.assign(window,o);W({S,draw,go:v=>{S.view=v;S.cat="";S.K=S.Q=S.CT="";S.PF=null;draw()}});
W({sendCode:async()=>{const p=$("#ph").value.replace(/\D/g,"").replace(/^0+/,"").replace(/^964/,"");if(p.length<9)return alert("ژمارەکێ دروست بنڤیسە");
try{window.rv=window.rv||new RecaptchaVerifier(auth,"rc",{size:"invisible"});conf=await signInWithPhoneNumber(auth,"+964"+p,window.rv);S.sent=1;draw()}catch(e){alert("خەلەتی: "+e.code);try{window.rv.clear()}catch(_){}window.rv=null}},
verify:async()=>{try{await conf.confirm($("#cd").value.trim());S.sent=0}catch(e){alert("کۆد خەلەتە")}},
emailAuth:async r=>{try{const e=$("#em").value.trim(),p=$("#pw").value;await(r?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,e,p)}catch(e){alert("خەلەتی: "+e.code)}},
logout:()=>signOut(auth)});
/* CV */
function cvView(){const c=CV;return`<h2>📄 CV ـا من</h2><div class="card">${[["name","ناڤ"],["title","پیشە"],["phone","ژمارا مۆبایلێ"],["email","ئیمەیل"],["city","شار"]].map(f=>`<label>${f[1]}</label><input value="${esc(c[f[0]])}" oninput="cvSet('${f[0]}',this.value)">`).join("")}
<label>دەربارەی من</label><textarea rows="2" oninput="cvSet('sum',this.value)">${esc(c.sum)}</textarea><label>شارەزایی (ب کۆما)</label><input value="${esc(c.skills)}" oninput="cvSet('skills',this.value)">
<label>ئەزموون</label><textarea rows="3" oninput="cvSet('exp',this.value)">${esc(c.exp)}</textarea><label>خوێندن</label><textarea rows="2" oninput="cvSet('edu',this.value)">${esc(c.edu)}</textarea></div>
<div class="chips">${TPL.map((t,i)=>`<button class="${c.tpl==i?"":"g"}" onclick="cvSet('tpl',${i},1)">${t}</button>`).join("")}</div>
<div class="row" style="margin-bottom:10px">${COLORS.map((k,i)=>`<button class="sw" style="background:${k};${c.col==i?"outline:3px solid var(--tx)":""}" onclick="cvSet('col',${i},1)"></button>`).join("")}</div>
<button class="full" style="margin-bottom:10px" onclick="pubCV()">📢 بەلاڤکرنا CV ل بەشێ کار</button><div id="pv">${cvHtml()}</div>
<div class="row" style="margin-top:10px"><button onclick="shareCV()">📤 بەلاڤکرن</button><button class="g" onclick="print()">🖨️ PDF</button></div>`}
W({cvSet:(k,v,r)=>{CV[k]=v;r?draw():$("#pv").innerHTML=cvHtml();clearTimeout(tm);tm=setTimeout(()=>setDoc(doc(db,"cvs",U.uid),CV).catch(()=>{}),800)},
pubCV:()=>{S.PF={t:(CV.name+" - "+CV.title).trim(),k:CATS.job.k[1],d:CV.sum,c:CV.city};S.view="job";S.cat="add";draw()},
shareCV:()=>{const t=`${CV.name}\n${CV.title}\n${CV.phone}\n\n${CV.sum}\n\n${CV.exp}\n\n${CV.edu}\n${CV.skills}`;navigator.share?navigator.share({text:t}).catch(()=>{}):(navigator.clipboard.writeText(t),alert("کۆپی بوو"))}});
function cvHtml(){const c=CV,k=COLORS[c.col],sk=c.skills.split(/[,،]/).filter(x=>x.trim()).map(x=>`<span class="tag" style="background:#fff;color:#333">${esc(x.trim())}</span>`).join("");
const info=`📞 ${esc(c.phone)}<br>${c.email?"✉️ "+esc(c.email)+"<br>":""}${c.city?"📍 "+esc(c.city):""}`,sec=(h,v)=>v?`<h4>${h}</h4><pre>${esc(v)}</pre>`:"";
const b=sec("دەربارە",c.sum)+sec("ئەزموون",c.exp)+sec("خوێندن",c.edu)+(sk?`<h4>شارەزایی</h4>${sk}`:""),nm=esc(c.name||"ناڤێ تە"),tt=esc(c.title||"پیشە");
if(c.tpl==1)return`<div class="cv t2" style="--c:${k}"><div class="sd"><h1 style="font-size:18px">${nm}</h1><div>${tt}</div><hr>${info}</div><div class="mn">${b}</div></div>`;
return`<div class="cv ${c.tpl==2?"t3":c.tpl==3?"t4":""}" style="--c:${k}"><div class="hd"><h1>${nm}</h1>${tt}<div style="font-size:12px;margin-top:6px">${info.replace(/<br>/g," • ")}</div></div><div class="p">${b}</div></div>`}
/* Listings */
const num=s=>parseFloat(String(s).replace(/[^\d.]/g,""))||0;
function catView(v){const C=CATS[v];if(S.cat=="add")return addView(v);const q=S.Q.toLowerCase();
const L=A.filter(x=>x.cat==v&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!S.K||x.k==S.K)&&(!S.CT||String(x.c).includes(S.CT))).sort((a,b)=>(b.vip?1:0)-(a.vip?1:0)||b.ts-a.ts);
return`<h2>${C.i} ${C.n}</h2><div class="row"><input placeholder="🔍 بگەڕێ..." value="${esc(S.Q)}" onchange="S.Q=this.value;draw()" style="flex:3"><button style="flex:1;height:42px" onclick="S.cat='add';draw()">＋ زێدەکرن</button></div>
<div class="chips">${["",...C.k].map(k=>`<button class="${S.K==k?"":"g"}" onclick="S.K='${k}';draw()">${k||"هەمی"}</button>`).join("")}</div><input placeholder="📍 شار" value="${esc(S.CT)}" onchange="S.CT=this.value;draw()">`+
(L.length?L.map(x=>{const own=x.uid==U.uid,ad=isAdmin();return`<div class="card" style="${x.vip?"border:2px solid #f59e0b":""}">${x.vip?`<div style="color:#f59e0b;font-weight:bold;margin-bottom:6px">⭐ VIP</div>`:""}${x.img?`<img class="img" src="${x.img}">`:""}
<b>${x.vip?"👑 ":""}${esc(x.t)}</b><div style="margin:6px 0"><span class="tag">${esc(x.k)}</span><span class="tag">📍 ${esc(x.c)}</span>${x.x?`<span class="tag">${esc(x.x)}</span>`:""}${x.vipReq&&!x.vip&&(own||ad)?`<span class="tag" style="color:#ea580c">⏳ چاڤەڕێ پشتڕاستکرنێ</span>`:""}</div>
${x.p?`<div class="pr">${esc(x.p)}</div>`:""}<p style="color:var(--mu);margin:6px 0">${esc(x.d)}</p>
${x.vipReq&&!x.vip&&own?`<a href="https://wa.me/${WA}?text=${encodeURIComponent("وەسڵ: "+x.rc+" | "+x.fee+" | "+x.t)}" target="_blank"><button class="g full" style="margin-bottom:8px">🧾 هنارتنا وەسڵێ ب واتساب</button></a>`:""}
<div class="row"><a href="https://wa.me/${esc(String(x.ph).replace(/^0/,"964").replace(/\D/g,""))}" target="_blank" style="text-decoration:none"><button class="full">💬 واتساب</button></a>
${own||ad?`<button class="g" onclick="delAd('${x.id}')">🗑️</button>`:""}${ad?`<button class="g" onclick="vipAd('${x.id}',${!x.vip})">${x.vip?"❌ VIP":"✅ VIP"}</button>`:""}</div></div>`}).join(""):`<div class="card" style="text-align:center;color:var(--mu)">چ تشت نینە</div>`)}
function addView(v){const C=CATS[v],P=S.PF||{};img="";return`<h2>＋ ${C.n}</h2><div class="card"><label>جۆر</label><select id="k">${C.k.map(k=>`<option ${P.k==k?"selected":""}>${k}</option>`).join("")}</select>
<label>سەردێر</label><input id="t" value="${esc(P.t||"")}"><label>${C.x}</label><input id="x"><label>نرخ / مووچە</label><input id="p"><label>شار</label><input id="c" value="${esc(P.c||"")}">
<label>وەسف</label><textarea id="d" rows="3">${esc(P.d||"")}</textarea><label>ژمارا واتساب</label><input id="ph" dir="ltr" value="${esc((U.phoneNumber||CV.phone||"").replace("+964","0"))}">
<label>وێنە</label><input type="file" accept="image/*" onchange="pic(this)">${payBox()}<div class="row"><button onclick="addItem('${v}')">بەلاڤکرن</button><button class="g" onclick="S.cat='';draw()">پاشڤە</button></div></div>`}
function qr(){try{const q=qrcode(0,"M");q.addData(PAY);q.make();return q.createDataURL(6,0)}catch(e){return""}}
function payBox(){return`<div class="card"><b>💰 کرێیا بەلاڤکرنێ</b><select id="fee" onchange="$('#payd').style.display=this.value=='0'?'none':'block'"><option value="0">بێ پارە — ئاسایی</option><option value="1000">1,000 — ٧ ڕۆژ</option><option value="2000">2,000 — ١٥ ڕۆژ</option><option value="3000">3,000 — ٣٠ ڕۆژ</option><option value="5000">5,000 — ٣ مانگ</option></select>
<p style="color:var(--mu);font-size:13px">⭐ ئەوێ پارەی بدەت ڕیکلامێ وی دچیتە سەری و VIP دبیت.</p><div id="payd" style="display:none"><div>${["FIB","FastPay","ZainCash","AsiaCell","SuperQi"].map(n=>`<button type="button" class="pm ${n==S.PM?"":"g"}" data-n="${n}" style="margin:3px;padding:6px 14px;border-radius:20px" onclick="selPM('${n}')">${n}</button>`).join("")}</div>
${qr()?`<div style="text-align:center"><img src="${qr()}" style="width:170px;height:170px;background:#fff;padding:8px;border-radius:12px"><div id="pml" style="font-size:13px;color:var(--mu)">باڕکۆد سکین بکە ب ${S.PM}</div></div>`:""}
<div dir="ltr" style="text-align:right;font-size:18px;margin:6px 0"><b>${PAY}</b></div><button class="g full" type="button" onclick="navigator.clipboard.writeText('${PAY}');alert('کۆپی بوو')">📋 کۆپیکرنا ژمارەیێ</button>
<label style="display:block;margin-top:8px">ژمارا وەسڵێ یان ناڤێ هنێرەر</label><input id="rc"></div></div>`}
W({$,selPM:n=>{S.PM=n;document.querySelectorAll(".pm").forEach(b=>b.className="pm"+(b.dataset.n==n?"":" g"));$("#pml").textContent="باڕکۆد سکین بکە ب "+n},
pic:i=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,500/m.width),c=document.createElement("canvas");c.width=m.width*k;c.height=m.height*k;c.getContext("2d").drawImage(m,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.6)};m.src=r.result};r.readAsDataURL(f)},
addItem:async v=>{const g=i=>$("#"+i).value.trim(),fee=+g("fee");if(!g("t"))return alert("سەردێرێ بنڤیسە");if(fee&&!g("rc"))return alert("ژمارا وەسڵێ بنڤیسە");
try{await addDoc(collection(db,"ads"),{uid:U.uid,cat:v,t:g("t"),k:g("k"),x:g("x"),p:g("p"),c:g("c"),d:g("d"),ph:g("ph"),img,vip:false,vipReq:fee>0,fee,pm:S.PM,rc:g("rc"),ts:Date.now()});S.cat="";S.PF=null;draw()}catch(e){alert("خەلەتی: "+e.code)}},
delAd:async id=>{if(confirm("ژێ ببە؟"))try{await deleteDoc(doc(db,"ads",id))}catch(e){alert(e.code)}},vipAd:async(id,b)=>{try{await updateDoc(doc(db,"ads",id),{vip:b})}catch(e){alert(e.code)}}});
function setView(){return`<h2>⚙️ ڕێکخستن</h2><div class="card"><b>هەژمار</b><p dir="ltr" style="text-align:right">${esc(U.phoneNumber||U.email)}</p>${isAdmin()?"<p>👑 ئەدمین</p>":""}</div>
<div class="card"><b>📞 پەیوەندی</b><div class="row" style="margin-top:8px"><a href="https://wa.me/${WA}" target="_blank" style="text-decoration:none"><button class="full">💬 واتساب</button></a><a href="mailto:${MAIL}" style="text-decoration:none"><button class="g full">✉️ ئیمەیل</button></a></div><p dir="ltr" style="text-align:right;color:var(--mu);font-size:13px">07513578668<br>${MAIL}</p></div>
<button class="g full" onclick="logout()">دەرکەتن</button>`}
</script></body></html>
